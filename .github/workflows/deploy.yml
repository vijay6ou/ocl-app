name: Deploy to VPS

# Every push to main updates the live server.
# Pull requests only run the tests, so a broken change can never reach the VPS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you deploy by hand from the Actions tab

jobs:
  test:
    name: Test the server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: server
        run: npm ci || npm install

      - name: Run API tests
        working-directory: server
        run: npm test

  deploy:
    name: Deploy to the VPS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            cd "${{ secrets.VPS_PATH }}"
            echo "── Fetching latest code ──"
            git fetch --all
            git reset --hard origin/main
            echo "── Deploying ──"
            bash deploy/update.sh
