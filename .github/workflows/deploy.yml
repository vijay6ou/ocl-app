name: Test and deploy

# On every push to main: run the tests, then deploy to the Oracle VPS.
# Pull requests run the tests only, so a broken change cannot reach the server.
#
# The deploy job stays INACTIVE until these five repository secrets exist
# (Settings -> Secrets and variables -> Actions):
#
#   VPS_HOST     158.101.199.190
#   VPS_USER     ubuntu
#   VPS_SSH_KEY  a private key that can log in as that user
#   VPS_PATH     /opt/ocl-maintenance
#   VPS_PORT     22            (optional; defaults to 22)
#
# Until they are set, this job fails fast with a clear message and the server is
# left alone. Nothing breaks by leaving it unconfigured.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you deploy by hand from the Actions tab

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci || npm install

      - name: Run API tests
        working-directory: server
        run: npm test

  deploy:
    name: Deploy to the VPS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the deploy secrets are configured
        id: check
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::notice title=Deploy skipped::VPS secrets are not set, so nothing was deployed. See .github/workflows/deploy.yml for the five secrets to add."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            cd "${{ secrets.VPS_PATH }}"
            echo "-- fetching latest code --"
            git fetch origin main
            git reset --hard origin/main
            echo "-- deploying --"
            bash deploy/update.sh
