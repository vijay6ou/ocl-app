name: CI

# Checks the build that deploy/update.sh performs on the server, so a broken
# commit is caught here rather than while the plant log is stopped.
#
# Note: devDependencies are required. Tailwind runs as a PostCSS plugin and
# Next type-checks with TypeScript, so an install that omits dev deps produces
# a build that cannot be reproduced.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      # Build first. Next.js generates next-env.d.ts and .next/types during a
      # build, and both are gitignored, so a standalone type check on a fresh
      # checkout fails on files that have not been generated yet.
      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .
