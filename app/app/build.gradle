plugins {
    id 'com.android.application'
}

android {
    namespace 'com.adani.ocl.maintenance'
    compileSdk 34

    defaultConfig {
        applicationId "com.adani.ocl.maintenance"
        minSdk 21          // Android 5.0 Lollipop — covers virtually all field devices
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Exclude dependency META-INF entries. NOTE: META-INF content comes from
    // dependency JARs/AARs, i.e. Java *resources* — the earlier
    // `packagingOptions { assets { ignores ... } }` form was invalid, because no
    // `assets` (or `ignores`) member exists in the packaging DSL.
    packaging {
        resources {
            excludes += ['META-INF/**']
        }
    }
}

dependencies {
    // No extra dependencies needed — pure WebView wrapper
}
