# OCL Maintenance — server stack for the Oracle VPS.
#
# IMPORTANT: this deployment does NOT include Caddy. The host already runs nginx
# on ports 80/443 for other live services, so Caddy would fight it for those
# ports. Instead:
#
#   internet → host nginx (existing, does HTTPS) → api container on 127.0.0.1:3100
#
# The API port is bound to localhost only, so it is never directly reachable.
#
# Start with:  docker compose up -d --build
#
# Required in .env (copy deploy/.env.example → .env):
#   JWT_SECRET

services:
  api:
    build: ./server
    image: ocl-maintenance-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      RELEASES_DIR: /app/releases
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      TOKEN_TTL: ${TOKEN_TTL:-30d}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Behind nginx: trust its forwarded headers so client IPs are accurate.
      TRUST_PROXY: "1"
    volumes:
      - ocl-data:/data
      - ./releases:/app/releases
    ports:
      # localhost ONLY — the public path is through nginx.
      - "127.0.0.1:3100:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  ocl-data:
