plugins {
    id "com.android.application"
}

android {
    namespace "com.ocl.maintenance"
    compileSdk 34

    defaultConfig {
        applicationId "com.ocl.maintenance"
        minSdk 21
        targetSdk 34
        versionCode 14
        versionName "1.12.0"
        buildConfigField "String", "DEFAULT_SERVER_URL", "\"http://158.101.199.190\""
    }

    signingConfigs {
        release {
            storeFile file("../ocl-release.jks")
            storePassword "oclplant26"
            keyAlias "ocl"
            keyPassword "oclplant26"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
}

def plantReleaseDir = file("${rootDir}/../data/releases")
def distDir = file("${rootDir}/dist")

tasks.register("publishToPlantServer") {
    dependsOn "assembleRelease"
    doLast {
        def apk = file("$buildDir/outputs/apk/release/app-release.apk")
        plantReleaseDir.mkdirs()
        distDir.mkdirs()
        copy {
            from apk
            into plantReleaseDir
            rename { "ocl-maintenance.apk" }
        }
        copy {
            from apk
            into distDir
            rename { "ocl-maintenance.apk" }
        }
        println "Published ${apk.length()} bytes to ${new File(plantReleaseDir, "ocl-maintenance.apk")}"
    }
}
